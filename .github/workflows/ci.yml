name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outdir /tmp/rfd-fyi-pages-functions

      - name: Validate scheduled Worker
        run: npx wrangler deploy --dry-run --config worker/wrangler.toml
